name: Temporary issue trigger test

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  marker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Write marker
        run: |
          echo "issue workflow ran" > .issue-workflow-marker.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .issue-workflow-marker.txt
          git commit -m 'Test issue-triggered workflow'
          git push origin HEAD:master
