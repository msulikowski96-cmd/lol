name: Temporary pull request trigger test

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  marker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Write marker
        run: |
          echo "pull request workflow ran" > .pr-workflow-marker.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .pr-workflow-marker.txt
          git commit -m 'Test pull-request-triggered workflow'
          git push origin HEAD:master
