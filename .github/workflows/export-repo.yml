name: Export repository manifest

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/export-repo.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate repository manifest
        shell: bash
        run: |
          find . -type f -not -path './.git/*' -not -path './.github/workflows/export-repo.yml' -print0 \
            | sort -z \
            | while IFS= read -r -d '' file; do
                printf '%s  %s\n' "$(git hash-object "$file")" "${file#./}"
              done > .repo-manifest.txt
          rm -f .github/workflows/export-repo.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Generate repository manifest for deployment comparison'
          git push origin HEAD:master
# Triggered through the GitHub contents API.
